<svg viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Détection 24/7">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070C1A"/>
      <stop offset="0.6" stop-color="#0B1A33"/>
      <stop offset="1" stop-color="#0E2747"/>
    </linearGradient>
    <radialGradient id="radar" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid2" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#16335C" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid2)" opacity="0.5"/>

  <g transform="translate(120,90)">
    <text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#38BDF8">C Y N A</text>
    <text y="20" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="2" fill="#7C93B8">SECURITY OPERATIONS CENTER</text>
  </g>

  <g transform="translate(120,250)" font-family="Segoe UI, Arial, sans-serif">
    <text font-size="74" font-weight="800" fill="#F1F5F9">Détection</text>
    <text y="86" font-size="74" font-weight="800" fill="#38BDF8">24 / 7</text>
    <text y="150" font-size="28" fill="#A9B9D4">Notre SOC veille pendant que vous dormez.</text>
    <g transform="translate(0,200)">
      <rect width="240" height="58" rx="29" fill="#0EA5E9"/>
      <text x="120" y="37" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Voir le SOC</text>
    </g>
  </g>

  <!-- Radar -->
  <g transform="translate(1190,320)">
    <circle r="240" fill="url(#radar)"/>
    <g fill="none" stroke="#1F4B7A" stroke-width="2">
      <circle r="70"/><circle r="130"/><circle r="190"/><circle r="240"/>
    </g>
    <line x1="-240" y1="0" x2="240" y2="0" stroke="#1F4B7A" stroke-width="2"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke="#1F4B7A" stroke-width="2"/>
    <path d="M0 0 L240 -70 A240 240 0 0 1 240 70 Z" fill="url(#sweep)"/>
    <line x1="0" y1="0" x2="240" y2="0" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="150" cy="-60" r="9" fill="#22C55E"/>
    <circle cx="-90" cy="110" r="9" fill="#F59E0B"/>
    <circle cx="60" cy="170" r="9" fill="#EF4444"/>
    <circle cx="-160" cy="-40" r="7" fill="#38BDF8"/>
  </g>
</svg>
