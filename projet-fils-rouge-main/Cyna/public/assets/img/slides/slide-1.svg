<svg viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Protégez votre entreprise">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1124"/>
      <stop offset="0.55" stop-color="#0F1E3D"/>
      <stop offset="1" stop-color="#15294F"/>
    </linearGradient>
    <radialGradient id="glow" cx="74%" cy="40%" r="55%">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#1E335C" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)" opacity="0.5"/>
  <rect width="1600" height="640" fill="url(#glow)"/>

  <!-- Brand -->
  <g transform="translate(120,90)">
    <text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#38BDF8">C Y N A</text>
    <text y="20" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="2" fill="#7C93B8">CYBERSÉCURITÉ MANAGÉE</text>
  </g>

  <!-- Headline -->
  <g transform="translate(120,250)" font-family="Segoe UI, Arial, sans-serif">
    <text font-size="74" font-weight="800" fill="#F1F5F9">Protégez votre</text>
    <text y="86" font-size="74" font-weight="800" fill="#3B82F6">entreprise</text>
    <text y="150" font-size="28" fill="#A9B9D4">Des solutions de cybersécurité managées, prêtes à l'emploi.</text>
    <g transform="translate(0,200)">
      <rect width="260" height="58" rx="29" fill="#2563EB"/>
      <text x="130" y="37" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Découvrir nos offres</text>
    </g>
  </g>

  <!-- Shield emblem -->
  <g transform="translate(1180,320)">
    <circle r="230" fill="#2563EB" opacity="0.08"/>
    <circle r="170" fill="#2563EB" opacity="0.10"/>
    <path d="M0 -170 L150 -110 V20 C150 120 80 175 0 210 C-80 175 -150 120 -150 20 V-110 Z" fill="url(#shield)" stroke="#60A5FA" stroke-width="3"/>
    <path d="M-58 5 L-18 50 L70 -55" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
