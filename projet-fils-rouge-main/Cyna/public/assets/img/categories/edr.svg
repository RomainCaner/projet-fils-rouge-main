<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EDR — Endpoint Detection and Response">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1124"/>
      <stop offset="1" stop-color="#0C2A24"/>
    </linearGradient>
    <radialGradient id="g" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1B3A33" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)" opacity="0.5"/>
  <rect width="800" height="600" fill="url(#g)"/>

  <!-- endpoints around a shield -->
  <g transform="translate(400,250)" stroke="#1F5247" stroke-width="2">
    <line x1="0" y1="0" x2="-150" y2="-90"/><line x1="0" y1="0" x2="150" y2="-90"/>
    <line x1="0" y1="0" x2="-150" y2="90"/><line x1="0" y1="0" x2="150" y2="90"/>
  </g>
  <g transform="translate(400,250)" fill="#102A24" stroke="#34D399" stroke-width="2">
    <g transform="translate(-170,-110)"><rect x="-26" y="-18" width="52" height="36" rx="3"/></g>
    <g transform="translate(170,-110)"><rect x="-26" y="-18" width="52" height="36" rx="3"/></g>
    <g transform="translate(-170,110)"><rect x="-26" y="-18" width="52" height="36" rx="3"/></g>
    <g transform="translate(170,110)"><rect x="-26" y="-18" width="52" height="36" rx="3"/></g>
  </g>
  <g transform="translate(400,250)">
    <path d="M0 -95 L82 -60 V12 C82 66 44 96 0 116 C-44 96 -82 66 -82 12 V-60 Z" fill="url(#sh)" stroke="#6EE7B7" stroke-width="2"/>
    <path d="M-30 5 L-8 28 L36 -28" fill="none" stroke="#06281F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="400" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="800" fill="#F1F5F9" text-anchor="middle" letter-spacing="4">EDR</text>
  <text x="400" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7FD9B6" text-anchor="middle" letter-spacing="2">Endpoint Detection &amp; Response</text>
  <text x="40" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#34D399">CYNA</text>
</svg>
