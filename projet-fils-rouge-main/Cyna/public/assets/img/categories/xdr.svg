<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XDR — Extended Detection and Response">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1124"/>
      <stop offset="1" stop-color="#1B1640"/>
    </linearGradient>
    <radialGradient id="g" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#2A2356" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)" opacity="0.5"/>
  <rect width="800" height="600" fill="url(#g)"/>

  <!-- correlation graph -->
  <g transform="translate(400,250)">
    <g stroke="#3C2F6B" stroke-width="2">
      <line x1="0" y1="0" x2="-160" y2="-70"/><line x1="0" y1="0" x2="155" y2="-85"/>
      <line x1="0" y1="0" x2="-130" y2="95"/><line x1="0" y1="0" x2="150" y2="80"/>
      <line x1="0" y1="0" x2="0" y2="-150"/>
      <line x1="-160" y1="-70" x2="0" y2="-150"/><line x1="155" y1="-85" x2="0" y2="-150"/>
      <line x1="-130" y1="95" x2="150" y2="80"/>
    </g>
    <g fill="#1E1A40" stroke="#A78BFA" stroke-width="2">
      <circle cx="-160" cy="-70" r="18"/><circle cx="155" cy="-85" r="18"/>
      <circle cx="-130" cy="95" r="18"/><circle cx="150" cy="80" r="18"/>
      <circle cx="0" cy="-150" r="18"/>
    </g>
    <circle r="34" fill="url(#core)" stroke="#C4B5FD" stroke-width="3"/>
  </g>

  <text x="400" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="800" fill="#F1F5F9" text-anchor="middle" letter-spacing="4">XDR</text>
  <text x="400" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#B7A6E6" text-anchor="middle" letter-spacing="2">Extended Detection &amp; Response</text>
  <text x="40" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#A78BFA">CYNA</text>
</svg>
