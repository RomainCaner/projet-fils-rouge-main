<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cyna SOC Essential">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1124"/><stop offset="1" stop-color="#122648"/>
    </linearGradient>
    <radialGradient id="g" cx="50%" cy="36%" r="60%">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.30"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2A52"/><stop offset="1" stop-color="#0A1E3C"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1C335A" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)" opacity="0.5"/>
  <rect width="800" height="600" fill="url(#g)"/>

  <text x="40" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#3B82F6">CYNA</text>
  <g transform="translate(690,42)"><rect width="70" height="30" rx="15" fill="#2563EB"/><text x="35" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">SOC</text></g>

  <!-- monitor -->
  <g transform="translate(150,120)">
    <rect width="500" height="280" rx="14" fill="url(#scr)" stroke="#234A82" stroke-width="2"/>
    <rect x="0" y="0" width="500" height="40" rx="14" fill="#0E2A52"/>
    <circle cx="26" cy="20" r="6" fill="#EF4444"/><circle cx="48" cy="20" r="6" fill="#F59E0B"/><circle cx="70" cy="20" r="6" fill="#22C55E"/>
    <text x="120" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7FA8D9">SOC • Live monitoring</text>
    <!-- chart -->
    <polyline points="40,230 110,180 170,205 240,140 310,165 380,100 460,130" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="40,250 110,225 170,235 240,205 310,215 380,185 460,200" fill="none" stroke="#2563EB" stroke-width="3" opacity="0.7"/>
    <!-- kpi cards -->
    <g font-family="Segoe UI, Arial, sans-serif">
      <rect x="40" y="70" width="120" height="46" rx="8" fill="#0A1E3C" stroke="#234A82"/><text x="52" y="92" font-size="13" fill="#7FA8D9">Alertes</text><text x="52" y="110" font-size="16" font-weight="700" fill="#fff">128</text>
      <rect x="190" y="70" width="120" height="46" rx="8" fill="#0A1E3C" stroke="#234A82"/><text x="202" y="92" font-size="13" fill="#7FA8D9">SLA</text><text x="202" y="110" font-size="16" font-weight="700" fill="#22C55E">1h</text>
      <rect x="340" y="70" width="120" height="46" rx="8" fill="#0A1E3C" stroke="#234A82"/><text x="352" y="92" font-size="13" fill="#7FA8D9">Sources</text><text x="352" y="110" font-size="16" font-weight="700" fill="#fff">50</text>
    </g>
  </g>

  <text x="40" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#F1F5F9">Cyna SOC Essential</text>
  <text x="40" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#9FB4D6">Supervision de sécurité managée pour les PME.</text>
</svg>
