<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cyna XDR Cloud">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1124"/><stop offset="1" stop-color="#0E2747"/>
    </linearGradient>
    <radialGradient id="g" cx="50%" cy="36%" r="60%">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.28"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#16335C" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)" opacity="0.5"/>
  <rect width="800" height="600" fill="url(#g)"/>

  <text x="40" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#38BDF8">CYNA</text>
  <g transform="translate(620,42)"><rect width="140" height="30" rx="15" fill="#0284C7"/><text x="70" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">XDR • CLOUD</text></g>

  <!-- cloud + k8s hexagons -->
  <g transform="translate(400,205)">
    <path d="M-120 30 a70 70 0 0 1 10 -139 a90 90 0 0 1 170 20 a60 60 0 0 1 -10 119 Z" fill="url(#cloud)" stroke="#BAE6FD" stroke-width="2"/>
    <path d="M-58 -20 L-30 -34 L-2 -20 V12 L-30 26 L-58 12 Z" fill="#0C3B5E" stroke="#fff" stroke-width="2"/>
  </g>
  <g transform="translate(400,360)" fill="#0A2A45" stroke="#38BDF8" stroke-width="2">
    <g stroke="#1F4E78" stroke-width="2"><line x1="0" y1="-120" x2="-150" y2="0"/><line x1="0" y1="-120" x2="0" y2="0"/><line x1="0" y1="-120" x2="150" y2="0"/></g>
    <g transform="translate(-150,0)"><path d="M-30 -16 L0 -32 L30 -16 V16 L0 32 L-30 16 Z"/></g>
    <g transform="translate(0,0)"><path d="M-30 -16 L0 -32 L30 -16 V16 L0 32 L-30 16 Z"/></g>
    <g transform="translate(150,0)"><path d="M-30 -16 L0 -32 L30 -16 V16 L0 32 L-30 16 Z"/></g>
  </g>

  <text x="40" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#F1F5F9">Cyna XDR Cloud</text>
  <text x="40" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#9FC9E8">XDR spécialisé pour les environnements cloud.</text>
