<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tableau de bord du SOC Cyna">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1124"/><stop offset="1" stop-color="#0F2244"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2A52"/><stop offset="1" stop-color="#0A1E3C"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.5"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="220" height="750" fill="#0A1A36"/>
  <text x="36" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#38BDF8">CYNA</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7FA8D9">
    <rect x="20" y="110" width="180" height="40" rx="8" fill="#163A6B"/><text x="44" y="136" fill="#fff">Dashboard</text>
    <text x="44" y="196">Alertes</text><text x="44" y="246">Incidents</text><text x="44" y="296">Sources</text><text x="44" y="346">Rapports</text>
  </g>

  <!-- header -->
  <text x="260" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#F1F5F9">Centre opérationnel de sécurité</text>
  <text x="260" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7FA8D9">Supervision en temps réel — 24h/24, 7j/7</text>

  <!-- KPI row -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(260,120)"><rect width="200" height="96" rx="12" fill="url(#card)" stroke="#234A82"/><text x="20" y="36" font-size="15" fill="#7FA8D9">Événements / jour</text><text x="20" y="74" font-size="30" font-weight="800" fill="#fff">1.2M</text></g>
    <g transform="translate(480,120)"><rect width="200" height="96" rx="12" fill="url(#card)" stroke="#234A82"/><text x="20" y="36" font-size="15" fill="#7FA8D9">Alertes ouvertes</text><text x="20" y="74" font-size="30" font-weight="800" fill="#F59E0B">37</text></g>
    <g transform="translate(700,120)"><rect width="200" height="96" rx="12" fill="url(#card)" stroke="#234A82"/><text x="20" y="36" font-size="15" fill="#7FA8D9">Menaces bloquées</text><text x="20" y="74" font-size="30" font-weight="800" fill="#22C55E">512</text></g>
    <g transform="translate(920,120)"><rect width="240" height="96" rx="12" fill="url(#card)" stroke="#234A82"/><text x="20" y="36" font-size="15" fill="#7FA8D9">Délai moyen réponse</text><text x="20" y="74" font-size="30" font-weight="800" fill="#38BDF8">52 min</text></g>
  </g>

  <!-- main chart -->
  <g transform="translate(260,250)">
    <rect width="640" height="290" rx="12" fill="url(#card)" stroke="#234A82"/>
    <text x="24" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Activité de détection (7 jours)</text>
    <path d="M40,250 L40,200 110,160 180,185 250,120 330,150 410,90 500,130 600,80 600,250 Z" fill="url(#area)"/>
    <polyline points="40,200 110,160 180,185 250,120 330,150 410,90 500,130 600,80" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <g stroke="#1C355E" stroke-width="1"><line x1="40" y1="250" x2="600" y2="250"/></g>
  </g>

  <!-- donut -->
  <g transform="translate(920,250)">
    <rect width="240" height="290" rx="12" fill="url(#card)" stroke="#234A82"/>
    <text x="24" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Par sévérité</text>
    <g transform="translate(120,165)" fill="none" stroke-width="26">
      <circle r="62" stroke="#162E54"/>
      <circle r="62" stroke="#22C55E" stroke-dasharray="180 210" transform="rotate(-90)"/>
      <circle r="62" stroke="#F59E0B" stroke-dasharray="80 310" stroke-dashoffset="-180" transform="rotate(-90)"/>
      <circle r="62" stroke="#EF4444" stroke-dasharray="40 350" stroke-dashoffset="-260" transform="rotate(-90)"/>
    </g>
  </g>
</svg>
