<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cyna XDR Unified">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1124"/><stop offset="1" stop-color="#1B1640"/>
    </linearGradient>
    <radialGradient id="g" cx="50%" cy="36%" r="60%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.30"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#2A2356" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)" opacity="0.5"/>
  <rect width="800" height="600" fill="url(#g)"/>

  <text x="40" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#A78BFA">CYNA</text>
  <g transform="translate(620,42)"><rect width="140" height="30" rx="15" fill="#7C3AED"/><text x="70" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">XDR • UNIFIED</text></g>

  <!-- multi-domain correlation -->
  <g transform="translate(400,235)" font-family="Segoe UI, Arial, sans-serif">
    <g stroke="#3C2F6B" stroke-width="2">
      <line x1="0" y1="0" x2="-210" y2="-80"/><line x1="0" y1="0" x2="210" y2="-80"/>
      <line x1="0" y1="0" x2="-210" y2="90"/><line x1="0" y1="0" x2="210" y2="90"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <g transform="translate(-210,-80)"><rect x="-52" y="-22" width="104" height="44" rx="10" fill="#1E1A40" stroke="#A78BFA" stroke-width="2"/><text y="5" fill="#C4B5FD">Cloud</text></g>
      <g transform="translate(210,-80)"><rect x="-52" y="-22" width="104" height="44" rx="10" fill="#1E1A40" stroke="#A78BFA" stroke-width="2"/><text y="5" fill="#C4B5FD">Réseau</text></g>
      <g transform="translate(-210,90)"><rect x="-52" y="-22" width="104" height="44" rx="10" fill="#1E1A40" stroke="#A78BFA" stroke-width="2"/><text y="5" fill="#C4B5FD">Endpoint</text></g>
      <g transform="translate(210,90)"><rect x="-52" y="-22" width="104" height="44" rx="10" fill="#1E1A40" stroke="#A78BFA" stroke-width="2"/><text y="5" fill="#C4B5FD">E-mail</text></g>
    </g>
    <circle r="46" fill="url(#core)" stroke="#C4B5FD" stroke-width="3"/>
    <text y="6" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">XDR</text>
  </g>

  <text x="40" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#F1F5F9">Cyna XDR Unified</text>
  <text x="40" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#B7A6E6">Détection étendue corrélant tous vos signaux.</text>
</svg>
