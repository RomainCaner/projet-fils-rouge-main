<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cyna EDR Managed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1124"/><stop offset="1" stop-color="#0B2630"/>
    </linearGradient>
    <radialGradient id="g" cx="50%" cy="36%" r="60%">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.28"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#16363B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)" opacity="0.5"/>
  <rect width="800" height="600" fill="url(#g)"/>

  <text x="40" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#2DD4BF">CYNA</text>
  <g transform="translate(600,42)"><rect width="160" height="30" rx="15" fill="#0D9488"/><text x="80" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#02211E" text-anchor="middle">EDR • MANAGED</text></g>

  <!-- shield with gear (managed) -->
  <g transform="translate(400,235)">
    <path d="M0 -110 L95 -72 V18 C95 84 50 118 0 140 C-50 118 -95 84 -95 18 V-72 Z" fill="url(#sh)" stroke="#5EEAD4" stroke-width="2"/>
    <g transform="translate(0,5)" fill="#02312C">
      <circle r="34"/>
      <g stroke="#02312C" stroke-width="14">
        <line x1="0" y1="-50" x2="0" y2="50"/><line x1="-50" y1="0" x2="50" y2="0"/>
        <line x1="-35" y1="-35" x2="35" y2="35"/><line x1="-35" y1="35" x2="35" y2="-35"/>
      </g>
      <circle r="34" fill="#02312C"/>
      <circle r="16" fill="#5EEAD4"/>
    </g>
  </g>
  <!-- experts row -->
  <g transform="translate(400,395)" fill="#0B2A2A" stroke="#2DD4BF" stroke-width="2">
    <g transform="translate(-90,0)"><circle r="16"/></g>
    <g transform="translate(-30,0)"><circle r="16"/></g>
    <g transform="translate(30,0)"><circle r="16"/></g>
    <g transform="translate(90,0)"><circle r="16"/></g>
  </g>

  <text x="40" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#F1F5F9">Cyna EDR Managed</text>
  <text x="40" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#9DD8D0">EDR entièrement managé par nos experts.</text>
</svg>
