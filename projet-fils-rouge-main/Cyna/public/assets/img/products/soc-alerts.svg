<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vue des alertes de sécurité">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1124"/><stop offset="1" stop-color="#0F2244"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2A52"/><stop offset="1" stop-color="#0A1E3C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <rect x="0" y="0" width="220" height="750" fill="#0A1A36"/>
  <text x="36" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#38BDF8">CYNA</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7FA8D9">
    <text x="44" y="136">Dashboard</text>
    <rect x="20" y="170" width="180" height="40" rx="8" fill="#163A6B"/><text x="44" y="196" fill="#fff">Alertes</text>
    <text x="44" y="246">Incidents</text><text x="44" y="296">Sources</text><text x="44" y="346">Rapports</text>
  </g>

  <text x="260" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#F1F5F9">Alertes de sécurité</text>
  <text x="260" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7FA8D9">Qualifiées et priorisées par nos analystes</text>

  <!-- table header -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7FA8D9">
    <text x="280" y="150">SÉVÉRITÉ</text><text x="470" y="150">MENACE</text><text x="820" y="150">SOURCE</text><text x="1010" y="150">STATUT</text>
  </g>

  <!-- rows -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16">
    <!-- row template -->
    <g transform="translate(260,170)">
      <rect width="900" height="60" rx="10" fill="url(#card)" stroke="#234A82"/>
      <rect x="20" y="18" width="92" height="24" rx="12" fill="#7F1D1D"/><text x="66" y="35" fill="#FCA5A5" text-anchor="middle">CRITIQUE</text>
      <text x="210" y="37" fill="#E2E8F0">Ransomware détecté</text>
      <text x="560" y="37" fill="#9FB4D6">SRV-FILE-02</text>
      <text x="760" y="37" fill="#FBBF24">En cours</text>
    </g>
    <g transform="translate(260,242)">
      <rect width="900" height="60" rx="10" fill="url(#card)" stroke="#234A82"/>
      <rect x="20" y="18" width="92" height="24" rx="12" fill="#78350F"/><text x="66" y="35" fill="#FCD34D" text-anchor="middle">ÉLEVÉE</text>
      <text x="210" y="37" fill="#E2E8F0">Connexion suspecte</text>
      <text x="560" y="37" fill="#9FB4D6">VPN-GW-01</text>
      <text x="760" y="37" fill="#FBBF24">En cours</text>
    </g>
    <g transform="translate(260,314)">
      <rect width="900" height="60" rx="10" fill="url(#card)" stroke="#234A82"/>
      <rect x="20" y="18" width="92" height="24" rx="12" fill="#1E3A8A"/><text x="66" y="35" fill="#93C5FD" text-anchor="middle">MOYENNE</text>
      <text x="210" y="37" fill="#E2E8F0">Scan de ports</text>
      <text x="560" y="37" fill="#9FB4D6">FW-EDGE</text>
      <text x="760" y="37" fill="#34D399">Bloquée</text>
    </g>
    <g transform="translate(260,386)">
      <rect width="900" height="60" rx="10" fill="url(#card)" stroke="#234A82"/>
      <rect x="20" y="18" width="92" height="24" rx="12" fill="#064E3B"/><text x="66" y="35" fill="#6EE7B7" text-anchor="middle">FAIBLE</text>
      <text x="210" y="37" fill="#E2E8F0">Échec d'authentification</text>
      <text x="560" y="37" fill="#9FB4D6">AD-DC-01</text>
      <text x="760" y="37" fill="#34D399">Résolue</text>
    </g>
    <g transform="translate(260,458)">
      <rect width="900" height="60" rx="10" fill="url(#card)" stroke="#234A82"/>
      <rect x="20" y="18" width="92" height="24" rx="12" fill="#1E3A8A"/><text x="66" y="35" fill="#93C5FD" text-anchor="middle">MOYENNE</text>
      <text x="210" y="37" fill="#E2E8F0">Malware en quarantaine</text>
      <text x="560" y="37" fill="#9FB4D6">PC-RH-14</text>
      <text x="760" y="37" fill="#34D399">Bloquée</text>
    </g>
  </g>
</svg>
