<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cyna EDR Protect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1124"/><stop offset="1" stop-color="#0C2A24"/>
    </linearGradient>
    <radialGradient id="g" cx="50%" cy="36%" r="60%">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.28"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1B3A33" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)" opacity="0.5"/>
  <rect width="800" height="600" fill="url(#g)"/>

  <text x="40" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#34D399">CYNA</text>
  <g transform="translate(690,42)"><rect width="70" height="30" rx="15" fill="#10B981"/><text x="35" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#06281F" text-anchor="middle">EDR</text></g>

  <!-- devices protected -->
  <g transform="translate(400,235)">
    <g transform="translate(-250,0)" fill="#0F2A24" stroke="#2A6B5A" stroke-width="2">
      <rect x="-50" y="-36" width="100" height="64" rx="6"/><rect x="-30" y="34" width="60" height="8" rx="4"/>
    </g>
    <g transform="translate(250,10)" fill="#0F2A24" stroke="#2A6B5A" stroke-width="2">
      <rect x="-34" y="-52" width="68" height="104" rx="10"/><circle cy="38" r="5" fill="#2A6B5A"/>
    </g>
    <g stroke="#1F5247" stroke-width="2"><line x1="-200" y1="0" x2="-95" y2="10"/><line x1="200" y1="10" x2="95" y2="20"/></g>
    <path d="M0 -110 L95 -72 V18 C95 84 50 118 0 140 C-50 118 -95 84 -95 18 V-72 Z" fill="url(#sh)" stroke="#6EE7B7" stroke-width="2"/>
    <path d="M-34 8 L-8 36 L42 -30" fill="none" stroke="#06281F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="40" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#F1F5F9">Cyna EDR Protect</text>
  <text x="40" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#9FD6C3">Protection des terminaux nouvelle génération.</text>
